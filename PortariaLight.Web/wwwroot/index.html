<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Portaria Light</title>
    <base href="/" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="PortariaLight.Web.styles.css" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #2c5aa0;
            --secondary-color: #6c757d;
            --success-color: #198754;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --light-bg: #f8f9fa;
            --card-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            --card-shadow-hover: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f7fb;
        }

        .navbar-brand {
            font-weight: 700;
            color: var(--primary-color) !important;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
        }

            .card:hover {
                box-shadow: var(--card-shadow-hover);
            }

        .btn {
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .table th {
            border-top: none;
            font-weight: 600;
            color: var(--secondary-color);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge {
            font-weight: 500;
            border-radius: 6px;
        }

        .modal-content {
            border: none;
            border-radius: 12px;
        }

        .toast {
            border: none;
            border-radius: 8px;
        }

        /* Estilos do layout padrão do Blazor */
        .page {
            position: relative;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        .sidebar {
            background-image: linear-gradient(180deg, rgb(5, 39, 103) 0%, #3a0647 70%);
        }

        .top-row {
            background-color: #f7f7f7;
            border-bottom: 1px solid #d6d5d5;
            justify-content: flex-end;
            height: 3.5rem;
            display: flex;
            align-items: center;
        }

            .top-row ::deep a, .top-row ::deep .btn-link {
                white-space: nowrap;
                margin-left: 1.5rem;
            }

            .top-row a:first-child {
                overflow: hidden;
                text-overflow: ellipsis;
            }

        @media (max-width: 640.98px) {
            .top-row:not(.auth) {
                display: none;
            }

            .top-row.auth {
                justify-content: space-between;
            }

            .top-row a, .top-row .btn-link {
                margin-left: 0;
            }
        }

        @media (min-width: 641px) {
            .page {
                flex-direction: row;
            }

            .sidebar {
                width: 250px;
                height: 100vh;
                position: sticky;
                top: 0;
            }

            .top-row {
                position: sticky;
                top: 0;
                z-index: 1;
            }

            .top-row, article {
                padding-left: 2rem !important;
                padding-right: 1.5rem !important;
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="d-flex flex-column justify-content-center align-items-center min-vh-100 bg-light">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Carregando...</span>
            </div>
            <p class="mt-3 text-muted">Inicializando Portaria Light...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
